<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tower</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrite, so a direct load or reload of
      // a client-side route (/watch/abc, /library, ...) is answered with this
      // 404 page instead of index.html. This is the standard workaround
      // (rafgraph/spa-github-pages, MIT): encode the real path into a query
      // string and redirect to the root, where a matching script in
      // index.html restores it before the router ever sees the URL.
      //
      // 0 path segments kept: this site is served at the domain root
      // (trojan-boot.github.io), not a /project-name/ subpath.
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
