<script type="text/javascript">
  // Restores the real path 404.html redirected here as a query string —
  // see public/404.html for why. Must run before the router mounts, so it
  // sits this early rather than in main.tsx.
  (function(l) {
    if (l.search[1] === '/') {
      var decoded = l.search.slice(1).split('&').map(function(s) {
        return s.replace(/~and~/g, '&')
      }).join('?');
      window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
    }
  }(window.location));
</script>
